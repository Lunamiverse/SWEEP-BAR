name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  release:
    name: Publish release
    # Publishes v<version from CMakeLists.txt> on every push to main (re-uploads assets if it exists).
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: macos
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: windows
          path: dist
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep -E '^project' CMakeLists.txt | sed -E 's/.*VERSION ([0-9.]+).*/\1/')
          TAG="v$VERSION"
          cp installer/prebuilt/SweepBarSetup-$VERSION-Windows.exe dist/ 2>/dev/null || true
          ls -la dist
          gh release view "$TAG" >/dev/null 2>&1 \
            || gh release create "$TAG" --target "$GITHUB_SHA" --title "SWEEP BAR $VERSION" --latest \
                 --notes "**Mac:** download SweepBar-$VERSION-macOS-Installer.pkg (universal: Apple Silicon + Intel, AU + VST3). The first time, right-click the .pkg and choose Open, since the build is not notarized. **Windows:** run SweepBarSetup-$VERSION-Windows.exe (VST3 for FL Studio)."
          gh release upload "$TAG" dist/* --clobber
